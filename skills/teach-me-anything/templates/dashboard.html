<!doctype html>
<!-- teach-me-anything console. Copy to index.html. The sidebar, progress meter, and
     default page are driven by the MENU object below; the Due panel is driven by the
     retention queue in reviews.js, shaped by the learner's choices in preferences.js.
     Edit only MENU here; edit reviews.js for the queue.
     The tutor-terminal drawer at the bottom talks to bin/study (copied from
     templates/bin/); opened straight off disk, the console still works without it. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Workspace</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="has-drawer">
  <div class="console">
    <nav class="side">
      <h1 id="topic"></h1>
      <div class="goalline" id="goalline"></div>
      <div class="meter"><span id="meter-fill"></span></div>
      <div class="meter-label" id="meter-label"></div>
      <div id="due"></div>
      <div id="menu"></div>
    </nav>
    <main class="stage">
      <!-- Shown when the tutor writes or changes a page; click refreshes the console in place. -->
      <button id="fresh" type="button" hidden>New content — refresh</button>
      <iframe id="stage" title="lesson"></iframe>
    </main>

    <!-- Tutor terminal, same-origin via bin/study-server.py. Collapsed to a bar
         when not in use; shows a hint instead of a shell if the console was opened
         straight off disk rather than served. -->
    <section id="drawer" class="collapsed" aria-label="Tutor terminal">
      <div id="drawer-bar" title="Click to open · drag to resize">
        <span id="drawer-dot"></span>
        <strong>Tutor terminal</strong>
        <span id="drawer-hint">⌃⌘T</span>
        <button id="drawer-toggle" type="button">Open</button>
      </div>
      <div id="term-host"><div id="term-offline" hidden></div></div>
    </section>
  </div>


  <!-- In-browser Review overlay: an ungraded flip-through of today's items. Nothing it
       shows reaches the tutor — the learner reports how it went, and the tutor reschedules. -->
  <div class="sr-overlay" id="sr" hidden>
    <div class="sr-card">
      <div class="sr-progress" id="sr-progress"></div>
      <div class="sr-prompt" id="sr-prompt"></div>
      <div class="sr-recall" id="sr-recall" hidden></div>
      <div class="sr-actions">
        <button id="sr-reveal">Reveal</button>
        <button id="sr-next" hidden>Next</button>
        <button id="sr-close" class="ghost">Close</button>
      </div>
      <p class="sr-note">Practice run — tell your tutor how it went, and they reschedule.</p>
    </div>
  </div>

  <!-- Retention queue: window.REVIEW = [ … ] -->
  <script src="reviews.js"></script>
  <!-- The learner's choices from preferences.html: window.PREFS = { … }. Missing is fine:
       the defaults below are the skill's own behaviour. -->
  <script src="preferences.js"></script>
  <script>
    /* ── The single source of truth for the sidebar. ──────────────────────
       Update this as learning grows:
         new lesson    → push to MENU.lessons and set MENU.current
                         (curriculum mode: give it the milestone: "m1" it belongs to)
         lesson done   → set that lesson's done: true
         new card      → push to MENU.cards
         goal changed  → update MENU.goalLine
         milestone     → set its status: "todo" | "active" | "known" | "passed"
       (The review queue lives in reviews.js and the learner's settings in
       preferences.js, not here.)                                              */
    const MENU = {
      topic: "<topic>",
      goalLine: "<one-line goal>",
      current: "lessons/0001-.html",       // page shown on load
      foundations: [
        { href: "goal.html", title: "Goal" },
        { href: "glossary.html", title: "Glossary" },
        { href: "sources.html", title: "Sources" },
        // curriculum mode: { href: "curriculum.html", title: "Curriculum" },
        { href: "preferences.html", title: "Preferences" },
      ],
      // Curriculum mode only — leave empty for an open workspace. Every milestone shows in
      // the menu from day one with its status, so the learner sees what is done and what is
      // coming; lessons file under the milestone named by their `milestone` key. pre / post
      // are the assessment pages that open and close it (assessments/m1-pre.html …), shown
      // once they exist. The meter counts milestones instead of lessons.
      milestones: [
        // { id: "m1", title: "Network fundamentals", status: "todo", pre: null, post: null },
      ],
      lessons: [
        // { n: 1, href: "lessons/0001-first.html", title: "First lesson", done: false, milestone: "m1" },
      ],
      cards: [
        // { href: "reference/0001-card.html", title: "A card" },
      ],
    };
  </script>
  <script>
    (function () {
      const $ = id => document.getElementById(id);
      const stage = $("stage");
      function go(href) { stage.src = href; }
      let navLinks = [];
      function setActive(href) {
        navLinks.forEach(a => a.classList.toggle("active", a.dataset.href === href));
      }

      /* Everything the sidebar shows, drawn from MENU, the review queue and the
         learner's preferences. Run once on load, and again with freshly fetched data
         by the new-content badge or a Save on preferences.html, so the console
         updates in place — a page reload would restart the drawer's terminal,
         cutting the tutor off mid-answer. */
      function render(MENU, REVIEW, PREFS) {
        $("topic").textContent = MENU.topic;
        $("goalline").textContent = MENU.goalLine;

        /* Curriculum mode when milestones exist: progress is milestones done, a denominator
           that is honest from day one. Otherwise lessons, which only grow as they are written. */
        const ms = Array.isArray(MENU.milestones) && MENU.milestones.length ? MENU.milestones : null;
        const STATUS = { todo: "to come", active: "in progress", known: "already known", passed: "passed" };
        if (ms) {
          const done = ms.filter(m => m.status === "passed" || m.status === "known").length;
          $("meter-fill").style.width = Math.round(100 * done / ms.length) + "%";
          $("meter-label").textContent = done + " of " + ms.length + " milestones done";
        } else {
          const done = MENU.lessons.filter(l => l.done).length;
          $("meter-fill").style.width = Math.round(100 * done / (MENU.lessons.length || 1)) + "%";
          $("meter-label").textContent =
            MENU.lessons.length ? done + " of " + MENU.lessons.length + " lessons done" : "no lessons yet";
        }

        function group(title, items, render) {
          return items.length ? '<div class="group">' + title + "</div>" + items.map(render).join("") : "";
        }
        const lessonLink = l =>
          `<a class="${l.done ? "done" : "todo"}" href="${l.href}" data-href="${l.href}">${l.title}</a>`;
        /* One block per milestone: its title and status tag, then what sits under it —
           the pre-assessment, its lessons in order, the post-assessment. */
        function milestone(m) {
          const status = STATUS[m.status] ? m.status : "todo";
          const assess = (href, title) => href ? `<a class="assess" href="${href}" data-href="${href}">${title}</a>` : "";
          /* Not started: a Start button that asks the tutor to open it. The learner picks
             the order; the sequence in curriculum.html is the tutor's advice, not a gate. */
          const tag = status === "todo"
            ? `<button type="button" class="tag start" data-start="${m.id}" data-title="${m.title}" title="Ask your tutor to open this milestone">Start</button>`
            : '<span class="tag ' + status + '">' + STATUS[status] + "</span>";
          return '<div class="milestone"><span>' + m.title + '</span>' + tag + "</div>" +
            '<div class="under">' + assess(m.pre, "Pre-assessment") +
            MENU.lessons.filter(l => l.milestone === m.id).map(lessonLink).join("") +
            assess(m.post, "Post-assessment") + "</div>";
        }
        $("menu").innerHTML =
          (ms
            ? ms.map(milestone).join("") +
              group("Other lessons", MENU.lessons.filter(l => !ms.some(m => m.id === l.milestone)), lessonLink)
            : group("Lessons", MENU.lessons, lessonLink)) +
          group("Reference cards", MENU.cards, c =>
            `<a href="${c.href}" data-href="${c.href}">${c.title}</a>`) +
          group("Foundations", MENU.foundations, f =>
            `<a href="${f.href}" data-href="${f.href}">${f.title}</a>`);

        /* Sidebar nav: open the page in the stage and highlight the active entry. */
        navLinks = Array.from(document.querySelectorAll("#menu a"));
        navLinks.forEach(a => a.addEventListener("click", e => {
          e.preventDefault();
          go(a.dataset.href);
          setActive(a.dataset.href);
        }));
        /* Start: one line into the drawer; the tutor sets the milestone active and the
           new-content badge redraws this tag. Without a live drawer, the learner asks. */
        document.querySelectorAll("#menu button[data-start]").forEach(b => b.addEventListener("click", () => {
          b.disabled = true; b.textContent = "Asking…";
          const line = "[console] Start milestone " + b.dataset.start + " — " + b.dataset.title + ".";
          Promise.resolve(window.tutorSend ? window.tutorSend(line) : false).then(ok => {
            b.textContent = ok ? "Asked" : "Ask your tutor";
            if (!ok) { b.disabled = false; b.title = "Say to your tutor: start " + b.dataset.title; }
          });
        }));

        /* ── Due-for-review panel, computed from reviews.js against today. ──
           Only DUE_CAP items are shown, shakiest first (lowest box, then most
           overdue). The rest wait unseen: a long backlog is the tutor's to
           spread out, never a number the learner has to face. How it shows is
           the learner's call (preferences.js, formats/preferences.md):
             review "daily"    → count, list and Review button (the default)
             review "optional" → a quiet Review button, no count, no list
             review "off"      → nothing
           and reviewCap sets DUE_CAP. */
        const prefs = PREFS && typeof PREFS === "object" ? PREFS : {};
        const mode = prefs.review === "optional" || prefs.review === "off" ? prefs.review : "daily";
        const DUE_CAP = Math.min(Math.max(parseInt(prefs.reviewCap, 10) || 6, 1), 20);
        const now = new Date();
        const today = now.getFullYear() + "-" +
          String(now.getMonth() + 1).padStart(2, "0") + "-" +
          String(now.getDate()).padStart(2, "0");
        const queue = Array.isArray(REVIEW) ? REVIEW : [];
        const due = queue.filter(item => item.due && item.due <= today)
          .sort((a, b) => (a.box || 1) - (b.box || 1) || (a.due < b.due ? -1 : a.due > b.due ? 1 : 0))
          .slice(0, DUE_CAP);

        /* Prompts are authored text, not markup — escape before it reaches innerHTML.
           Several carry quotes and angle brackets (policy snippets, <run-id>). */
        const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                                  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

        if (mode === "off") {
          $("due").innerHTML = "";
        } else if (mode === "optional" && due.length) {
          $("due").innerHTML = '<div class="due"><div class="group">Review</div>' +
            '<p class="due-clear">Ready when you want it.</p>' +
            '<button class="due-start" id="due-start">Review</button></div>';
          $("due-start").addEventListener("click", () => runReview(due));
        } else if (due.length) {
          let peekOpen = true;
          try { peekOpen = localStorage.getItem("duePeek") !== "closed"; } catch (e) {}
          const n = due.length + (due.length === 1 ? " question" : " questions");
          $("due").innerHTML =
            '<div class="due">' +
            '<div class="group">Due for review <span class="badge">' + due.length + "</span></div>" +
            '<button class="due-start" id="due-start">Review</button>' +
            '<details class="due-peek" id="due-peek"' + (peekOpen ? " open" : "") + ">" +
            '<summary><span class="when-closed">Show ' + n + "</span>" +
            '<span class="when-open">Hide ' + n + "</span></summary>" +
            "<ul>" + due.map(d =>
              '<li title="' + esc(d.prompt) + '">' + esc(d.prompt) + "</li>").join("") +
            "</ul></details></div>";
          $("due-start").addEventListener("click", () => runReview(due));
          $("due-peek").addEventListener("toggle", function () {
            try { localStorage.setItem("duePeek", this.open ? "open" : "closed"); } catch (e) {}
          });
        } else if (queue.length) {
          $("due").innerHTML = '<div class="due"><div class="group">Review</div>' +
            '<p class="due-clear">Nothing due today ✓</p></div>';
        } else {
          $("due").innerHTML = "";
        }
      }

      /* ── Ungraded flip-through of today's items. Rescheduling is the tutor's job. ── */
      function runReview(items) {
        let i = 0;
        const overlay = $("sr");
        function show() {
          $("sr-progress").textContent = (i + 1) + " / " + items.length;
          $("sr-prompt").textContent = items[i].prompt;
          $("sr-recall").textContent = items[i].recall;
          $("sr-recall").hidden = true;
          $("sr-reveal").hidden = false;
          $("sr-next").hidden = true;
        }
        $("sr-reveal").onclick = () => { $("sr-recall").hidden = false; $("sr-reveal").hidden = true; $("sr-next").hidden = false; };
        $("sr-next").onclick = () => { i++; if (i < items.length) show(); else close(); };
        $("sr-close").onclick = close;
        function close() { overlay.hidden = true; }
        show();
        overlay.hidden = false;
      }

      render(MENU, window.REVIEW, window.PREFS);
      go(MENU.current);
      setActive(MENU.current);
      const activeHref = () => {
        const a = document.querySelector("#menu a.active");
        return a ? a.dataset.href : null;
      };

      /* The Due panel is "due ≤ today", and today changes. A tab left open overnight
         would keep yesterday's panel, so redraw the sidebar from what is already loaded
         when the date rolls over — no fetch, the stage untouched, works off disk too. */
      let loaded = { menu: MENU, review: window.REVIEW, prefs: window.PREFS };
      const dayOf = () => new Date().toDateString();
      let day = dayOf();
      setInterval(() => {
        if (dayOf() === day) return;
        day = dayOf();
        const active = activeHref();
        render(loaded.menu, loaded.review, loaded.prefs);
        setActive(active || loaded.menu.current);
      }, 60000);

      /* Re-read the three data files. A missing or half-written preferences.js
         keeps what was loaded rather than breaking the redraw. */
      async function reload() {
        const text = url => fetch(url, { cache: "no-store" }).then(r => r.ok ? r.text() : "");
        const [html, js, pjs] = await Promise.all([text("index.html"), text("reviews.js"), text("preferences.js")]);
        const doc = new DOMParser().parseFromString(html, "text/html");
        const src = Array.from(doc.scripts).map(s => s.textContent).find(t => /const MENU\s*=/.test(t));
        const menu = new Function(src + "\nreturn MENU;")();
        const review = new Function(js + "\nreturn window.REVIEW;")();
        let prefs = loaded.prefs;
        try { if (pjs) prefs = new Function(pjs + "\nreturn window.PREFS;")(); } catch (e) {}
        return { menu, review, prefs };
      }

      /* What preferences.html calls after a Save: redraw the sidebar and leave the
         stage alone, so the learner stays on the page they just saved. */
      window.refreshSidebar = async function () {
        const active = activeHref();
        loaded = await reload();
        render(loaded.menu, loaded.review, loaded.prefs);
        setActive(active || loaded.menu.current);
      };

      /* The look: style.css imports theme.css, which Save on preferences.html rewrites.
         Load the stylesheet again at a fresh address, and drop the old one only once
         the new one is in, so nothing flashes unstyled. Pages the stage opens later
         import the new theme.css on their own. */
      window.refreshTheme = function () {
        const old = document.querySelector('link[rel="stylesheet"][href^="assets/style.css"]');
        if (!old) return;
        const fresh = old.cloneNode();
        fresh.href = "assets/style.css?t=" + Date.now();
        fresh.onload = function () { old.remove(); };
        old.after(fresh);
      };

      /* What the new-content badge calls: re-read this file and reviews.js, redraw the
         sidebar from the fresh MENU, and bring the stage to whatever `current` now
         points at — reloading it if that is the page already showing. */
      window.refreshConsole = async function () {
        window.refreshTheme();
        loaded = await reload();
        const menu = loaded.menu;
        render(menu, loaded.review, loaded.prefs);
        const target = new URL(menu.current, location.href).href;
        let showing = "";
        try { showing = stage.contentWindow.location.href; } catch (e) {}
        if (showing === target) stage.contentWindow.location.reload(); else go(menu.current);
        setActive(menu.current);
      };
    })();
  </script>
  <script>
    /* ── Tutor terminal drawer ──────────────────────────────────────────
       The terminal is only fetched when the drawer is first opened, so the
       console still works when nothing is serving it. */
    (function () {
      var drawer = document.getElementById("drawer");
      var host = document.getElementById("term-host");
      var bar = document.getElementById("drawer-bar");
      var toggle = document.getElementById("drawer-toggle");
      var offline = document.getElementById("term-offline");
      var served = location.protocol === "http:" || location.protocol === "https:";
      var loaded = false;

      function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

      var savedH = parseInt(get("drawerHeight") || "", 10);
      if (savedH > 120) drawer.style.setProperty("--drawer-h", savedH + "px");

      function ensureTerminal() {
        if (loaded) return;
        loaded = true;
        if (!served) {
          offline.hidden = false;
          offline.innerHTML = "The tutor terminal needs the workspace served locally.<br>" +
            "Run <code>bin/study</code> in your own terminal — it prints the address and opens it.";
          return;
        }
        var f = document.createElement("iframe");
        f.title = "tutor terminal";
        f.src = "/terminal/";
        host.appendChild(f);
      }

      function setOpen(open) {
        drawer.classList.toggle("collapsed", !open);
        toggle.textContent = open ? "Hide" : "Open";
        put("drawerOpen", open ? "1" : "0");
        if (open) {
          ensureTerminal();
          var f = host.querySelector("iframe");
          if (f) setTimeout(function () { try { f.contentWindow.focus(); } catch (e) {} }, 60);
        }
      }
      function isOpen() { return !drawer.classList.contains("collapsed"); }

      toggle.addEventListener("click", function (e) { e.stopPropagation(); setOpen(!isOpen()); });

      /* Drag the bar to resize. A press that never moved counts as a click. */
      var dragging = false, startY = 0, startH = 0, moved = false;
      bar.addEventListener("mousedown", function (e) {
        if (e.target === toggle) return;
        dragging = true; moved = false; startY = e.clientY;
        startH = drawer.getBoundingClientRect().height;
        e.preventDefault();
      });
      window.addEventListener("mousemove", function (e) {
        if (!dragging) return;
        var dy = startY - e.clientY;
        if (!moved && Math.abs(dy) > 3) { moved = true; if (!isOpen()) setOpen(true); }
        if (!moved) return;
        var h = Math.min(Math.max(startH + dy, 140), window.innerHeight - 140);
        drawer.style.setProperty("--drawer-h", h + "px");
      });
      window.addEventListener("mouseup", function () {
        if (!dragging) return;
        dragging = false;
        if (!moved) setOpen(!isOpen());
        else put("drawerHeight", Math.round(drawer.getBoundingClientRect().height));
      });

      function hotkey(e) {
        if (e.ctrlKey && e.metaKey && (e.key === "t" || e.key === "T")) {
          e.preventDefault();
          setOpen(!isOpen());
        }
      }
      document.addEventListener("keydown", hotkey);
      /* Keys typed inside the terminal never reach this document; same origin
         lets us listen in there too, so the shortcut works either side. */
      host.addEventListener("load", function (e) {
        try {
          var doc = e.target.contentDocument;
          /* The dot reports what actually loaded: a terminal, or the server's
             "not running" page. Green should never mean "an iframe exists". */
          drawer.classList.toggle("live", !/not running/i.test(doc.title || ""));
          doc.addEventListener("keydown", hotkey);
        } catch (err) {}
      }, true);

      var saved = get("drawerOpen");
      setOpen(saved === null ? true : saved === "1");

      /* ── Typing into the drawer ────────────────────────────────────────
         A page's "Send to tutor" (assets/submit.js) calls this with a one-line
         note. The terminal is same-origin, so we hand the text to xterm the way
         a paste does, then press Enter. Resolves false when there is no live
         terminal to take it, and the page tells the learner to speak up instead. */
      window.tutorSend = function (line) {
        if (!served) return Promise.resolve(false);
        if (!isOpen()) setOpen(true);
        return new Promise(function (resolve) {
          var tries = 0;
          (function attempt() {
            var ta = null;
            try {
              var f = host.querySelector("iframe");
              ta = f && drawer.classList.contains("live") &&
                f.contentDocument.querySelector(".xterm-helper-textarea");
            } catch (e) {}
            if (!ta) {
              if (++tries > 40) return resolve(false);   // ~4 s for a fresh drawer to load
              return setTimeout(attempt, 100);
            }
            try {
              var dt = new DataTransfer();
              dt.setData("text/plain", line);
              ta.dispatchEvent(new ClipboardEvent("paste", { clipboardData: dt, bubbles: true, cancelable: true }));
              setTimeout(function () {
                ta.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", code: "Enter", keyCode: 13, which: 13, bubbles: true }));
                try { f.contentWindow.focus(); } catch (e) {}
                resolve(true);
              }, 200);
            } catch (e) { resolve(false); }
          })();
        });
      };
    })();
  </script>
  <script>
    /* ── New-content badge ──────────────────────────────────────────────
       The tutor writes pages straight into the workspace; nothing pushes them
       here. So, when served, ask bin/study-server.py every few seconds for the
       newest page and show a badge once something lands. A click redraws the
       console in place (window.refreshConsole, above) rather than reloading the
       page, which would restart the drawer's terminal mid-answer. It is a badge
       and not an auto-refresh so a half-answered quiz is never wiped. */
    (function () {
      if (location.protocol !== "http:" && location.protocol !== "https:") return;
      var badge = document.getElementById("fresh");
      var seen = null, newest = 0;
      function poll() {
        fetch("/changes", { cache: "no-store" }).then(function (r) { return r.json(); })
          .then(function (c) {
            newest = c.stamp;
            if (seen === null) { seen = c.stamp; return; }
            if (c.stamp > seen) { badge.title = c.latest; badge.hidden = false; }
          })
          .catch(function () {});
      }
      badge.addEventListener("click", function () {
        badge.hidden = true;
        seen = newest;
        window.refreshConsole().catch(function () { location.reload(); });
      });
      poll();
      setInterval(poll, 3000);
    })();
  </script>
</body>
</html>
